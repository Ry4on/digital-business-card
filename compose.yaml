services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: business_card
      POSTGRES_PASSWORD: business_card
      POSTGRES_DB: business_card
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U business_card -d business_card"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    init: true
    environment:
      DATABASE_URL: postgresql://business_card:business_card@db:5432/business_card
      NODE_ENV: production
      PORT: "3000"
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 15s

volumes:
  postgres_data:
