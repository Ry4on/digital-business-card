name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: business_card
          POSTGRES_PASSWORD: business_card
          POSTGRES_DB: business_card_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U business_card -d business_card_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://business_card:business_card@localhost:5432/business_card_test
      TEST_DATABASE_URL: postgresql://business_card:business_card@localhost:5432/business_card_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install pinned pnpm
        run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm db:deploy
      - run: pnpm db:seed
      - run: pnpm test:integration
      - name: Start complete stack from an empty database
        env:
          POSTGRES_PORT: "5433"
        run: docker compose -p business-card-ci up --build --wait --wait-timeout 120
      - name: Query the containerized API
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const response = await fetch('http://127.0.0.1:3000/graphql', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ query: '{ profile { name skills { name } experience { company } projects { name url } } }' }),
          });
          assert.equal(response.status, 200);
          const body = await response.json();
          assert.equal(body.errors, undefined);
          assert.ok(body.data.profile.name);
          assert.ok(body.data.profile.skills.length > 0);
          assert.ok(body.data.profile.projects.length > 0);
          NODE
      - name: Container logs
        if: failure()
        env:
          POSTGRES_PORT: "5433"
        run: docker compose -p business-card-ci logs --no-color
      - name: Remove ephemeral stack
        if: always()
        env:
          POSTGRES_PORT: "5433"
        run: docker compose -p business-card-ci down --volumes --remove-orphans
